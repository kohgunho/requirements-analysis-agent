<div class="row"><div><span class="tag">Baseline ${r.version}</span> <span class="tag">${r.priority}</span></div><div>${!r.owner?`<button class="btn purple" onclick="openAssign('${r.id}')">담당자 배정</button>`:''} <button class="btn blue" onclick="openCR('${r.id}')">수정 요청</button></div></div></div>`}
function assignHtml(){let r=assignReq, recs=recommend(r);return `<div class="card" style="border:2px solid #c4b5fd"><div class="row"><div><div style="font-size:12px;color:#64748b">미배정 요구사항 담당자 추천</div><h2 style="margin:4px 0">${r.id} · ${r.title}</h2><p style="margin:4px 0;color:#64748b">요청 모듈: <b>${r.module}</b> / 우선순위: <b>${r.priority}</b></p></div><button class="btn gray" onclick="closeAssign()">닫기</button></div>

<div class="card"><b>배정 후 처리</b><p style="font-size:13px">담당자 Assign → 상태 ‘검토중’ 변경 → 담당자 Notification → Capacity 재계산 → Workflow 반영</p></div></div>`}
function changeHtml(){return `${crDraft?crEditorHtml():''}<div class="card"><div class="row"><div><b>🔄 Change Request 관리</b><p style="font-size:13px;color:#64748b">기존 Baseline 요구사항을 기준으로 변경사항 → 영향도 → 추가공수 → O-NE IT운영 승인 → Version 반영</p></div><button class="btn blue" onclick="crDraft={reqId:reqs[0].id,change:'',reason:'',impact:null,effort:null,approver:reqs[0].owner||'고건호님',status:'작성중',versionFrom:reqs[0].version,versionTo:nextVersion(reqs[0].version)};render()">+ Change Request</button></div>
${crs.map(c=>`<div class="mock" style="margin-top:12px"><div class="row"><div><b>${c.id} · ${c.title}</b><p style="margin:5px 0">${c.reqId} / ${c.from} → ${c.to}</p></div><span class="tag">${c.status}</span></div>
${c.impact?`<div style="font-size:12px;color:#64748b">영향: ${c.impact.join(' · ')} / 추가공수: 약 ${c.effort.total} M/D (${c.effort.grade})</div>`:''}
${c.status==='O-NE IT운영 승인대기'?`<div class="row" style="margin-top:10px"><span style="font-size:12px">승인담당: <b>${c.owner}</b></span><div><button class="btn gray" onclick="rejectCR('${c.id}')">보완요청</button> <button class="btn green" onclick="approveCR('${c.id}')">승인</button></div></div>`:''}</div>`).join('')}</div>`}
function crEditorHtml(){let r=reqs.find(x=>x.id===crDraft.reqId);return `<div class="card" style="border:2px solid #c4b5fd"><div class="row"><div><div style="font-size:12px;color:#64748b">Change Request 작성</div><h2 style="margin:4px 0">${r.id} · ${r.title}</h2></div><button class="btn gray" onclick="crDraft=null;render()">닫기</button></div>
<div style="margin-top:15px;padding:16px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0"><div class="row"><b>① 기존 요구사항 Baseline</b><span class="tag">${r.version}</span></div>
<div class="grid g4" style="margin-top:12px"><div class="mock"><b>요청자</b><p>${r.requester}</p></div><div class="mock"><b>담당자</b><p>${r.owner||'미배정'}</p></div><div class="mock"><b>모듈/화면</b><p>${r.module} / ${r.screen}</p></div><div class="mock"><b>현재 상태</b><p>${r.status}</p></div></div>
<div class="card"><b>최초 작성 내용</b><p style="white-space:pre-wrap;line-height:1.7">${r.content}</p></div>
<div class="grid g3"><div class="mock"><b>AS-IS</b><p>${r.asis}</p></div><div class="mock"><b>TO-BE</b><p>${r.tobe}</p></div><div class="mock"><b>Acceptance Criteria</b><p>${r.acceptance}</p></div></div></div>
<div style="margin-top:18px"><b>② 변경되어야 하는 부분</b><label>변경 사유</label><input value="${crDraft.reason||''}" oninput="crDraft.reason=this.value" placeholder="왜 기존 확정 요구사항을 변경해야 하는지 입력"><label>변경 내용</label><textarea oninput="crDraft.change=this.value" placeholder="기존 요구사항에서 무엇을 어떻게 변경/추가/삭제해야 하는지 구체적으로 작성">${crDraft.change||''}</textarea><button class="btn purple" style="margin-top:10px" onclick="analyzeCR()">AI 변경 영향도 분석</button></div>
${crDraft.impact?`<div style="margin-top:18px"><b>③ 변경 영향도</b><div class="grid g3" style="margin-top:10px">${crDraft.impact.map(x=>`<div class="mock"><b>${x}</b><p>기존 Baseline 대비 재검토 필요</p></div>`).join('')}</div>
<div class="card"><b>④ 추가 예상 공수</b><div class="grid g4" style="margin-top:10px"><div class="kpi"><b>${crDraft.effort.analysis}</b><div>분석/설계 M/D</div></div><div class="kpi"><b>${crDraft.effort.dev}</b><div>개발 M/D</div></div><div class="kpi"><b>${crDraft.effort.test}</b><div>테스트 M/D</div></div><div class="kpi"><b>${crDraft.effort.total}</b><div>총 추가 M/D · ${crDraft.effort.grade}</div></div></div><p style="font-size:12px;color:#64748b">※ PoC 추정치. 실제 공수는 ONS/개발조직 영향도 분석 후 확정.</p></div>
<div class="card"><b>⑤ O-NE IT운영 승인</b><label>승인 담당자</label><select style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px" onchange="crDraft.approver=this.value">${itOpsApprovers.map(x=>`<option ${crDraft.approver===x?'selected':''}>${x}</option>`).join('')}</select><div class="row" style="margin-top:12px"><span style="font-size:13px;color:#64748b">승인 후 ${r.version} → <b>${crDraft.versionTo}</b> Baseline 변경 및 관련자 Notification</span><button class="btn green" onclick="submitCR()">승인 요청</button></div></div></div>`:''}</div>`}
function meetingHtml(){return `<div class="grid g2"><div class="card"><b>회의/협의 입력</b><textarea>배송예정시간은 배송출발 이후에만 노출하기로 협의. ONS에서 데이터 생성 가능 여부 확인 후 10/5까지 회신.</textarea><button class="btn blue">AI 구조화</button></div><div class="card"><b>Requirement / Decision / Action</b><div class="mock"><b>Requirement</b><p>배송예정시간 노출조건 변경</p></div><div class="mock"><b>Decision</b><p>배송출발 이전 예상시간 미노출</p></div><div class="mock"><b>Action</b><p>ONS 데이터 생성 가능 여부 확인 / Due 10/5</p></div></div></div>`}

<div class="card"><div class="row"><div><b>신규 SR 배정 프로세스</b><div class="flowlegend">각 단계의 큰 숫자는 <b>현재 단계 건수</b>, 하단은 해당 단계까지 도달한 <b>누적 건수</b>입니다. 클릭하면 해당 단계 요구사항 현황으로 이동합니다.</div></div><span class="tag">전체 ${reqs.length}건</span></div>
<div class="flow">${stageNames.map((name,i)=>{let n=i+1,exact=stageExactCount(n),cum=stageCumulativeCount(n);return `<div class="flowstep ${exact?'active':''}" onclick="openStageList(${n})"><div class="n">STEP ${n}</div><div class="count">${exact}건</div><div class="name">${name}</div><div class="cum">누적 ${cum}건</div></div>`}).join('')}</div></div>
<div class="card"><b>인원별 Capacity / 담당 모듈</b>${team.map(m=>`<div style="margin:16px 0"><div class="row"><div><b>${m.name}</b><div style="font-size:12px;color:#64748b">${m.modules.join(' · ')}</div></div><span>${m.load}% 가동 / 잔여 ${m.remain}H</span></div><div class="bar"><div style="width:${m.load}%"></div></div></div>`).join('')}</div>`}
function workflowHtml(){return `<div class="card"><b>Workflow 상태 트랙</b><div class="steps" style="margin-top:16px">${['작성중','요구사항 제출','검토중','요구사항 확정','개발중','테스트중','배포완료'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="grid g3" style="margin-top:18px"><div class="mock"><b>Communication Agent</b><p>Requirement / Mock-up / Version / Decision / Action</p></div><div class="mock"><b>LoIS ServIN</b><p>SR 임시저장 / 정식등록 / 승인</p></div><div class="mock"><b>CJL Jira</b><p>개발 / 리뷰 / 테스트 / 배포</p></div></div></div>`}
function assetsHtml(){return `<div class="grid g2"><div class="card"><b>시스템 자산</b><div class="grid g2" style="margin-top:12px"><div class="mock">Screen<br><b>77</b></div><div class="mock">ERD / Table<br><b>연계예정</b></div><div class="mock">Field 정의<br><b>연계예정</b></div><div class="mock">기존 SR/History<br><b>4</b></div></div></div><div class="card"><b>Agent 분석 활용</b><p>• 기존·유사 기능 검색</p><p>• 중복 요청 방지</p><p>• 영향도 분석 Context</p><p>• Version 비교</p></div></div><div class="card"><b>Lifecycle 연계 구조</b><div class="flow"><div class="flowstep active"><div class="name">Requirement</div><div class="cum">Communication Agent</div></div><div class="flowstep active"><div class="name">ServIN SR</div><div class="cum">요청/승인 ID</div></div><div class="flowstep active"><div class="name">Jira Ticket</div><div class="cum">개발/테스트/배포</div></div><div class="flowstep active"><div class="name">현황 자동반영</div><div class="cum">고객테스트/배포</div></div></div></div>`}

nav();render();
